name: snake

on:
  schedule:
    - cron: "0 0 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#8b1e1e&color_dots=#ebedf0,#f3e3b5,#e2c06e,#d4a24c,#8a6424
            dist/snake-dark.svg?palette=github-dark&color_snake=#b83232&color_dots=#161b22,#3b2a12,#6b4a1c,#a8782e,#f2c14e
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
